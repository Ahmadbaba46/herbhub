name: herbhub
description: "HerbHub — herbal practice manager (owner, helpers and patients)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  record: ^7.1.1
  cached_network_image: ^4.0.4
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Noto Sans covers Hausa (Ɗ ɗ Ƙ ƙ Ƴ ƴ). Arabic glyphs are added in a later
  # phase (bundling Noto Sans Arabic / Noto Kufi Arabic for the patient app).
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
